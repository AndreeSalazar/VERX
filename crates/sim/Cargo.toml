[package]
name = "verx-sim"
description = "Galaxia interactiva para el héroe 3D de VERX, compilada a WebAssembly"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# cdylib → el .wasm para el navegador · rlib → tests nativos con `cargo test`
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

# Puente Rust → JS: `bun run wasm` lo compila y lo publica en este paquete.
[package.metadata.verx]
bridge = "packages/sim"
wasm = "sim.wasm"
