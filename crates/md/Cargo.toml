[package]
name = "verx-md"
description = "Markdown a HTML para VERX, con resaltado de código, en Rust compilado a WebAssembly"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# cdylib → el .wasm · rlib → tests nativos con `cargo test`
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

# Puente Rust → JS: `bun run wasm` lo compila y lo publica en este paquete.
[package.metadata.verx]
bridge = "packages/md"
wasm = "md.wasm"
