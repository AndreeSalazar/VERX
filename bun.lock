{
  "lockfileVersion": 1,
  "configVersion": 1,
  "workspaces": {
    "": {
      "name": "verx-monorepo",
    },
    "apps/web": {
      "name": "web",
      "dependencies": {
        "@verx/gl": "workspace:*",
        "@verx/kit": "workspace:*",
        "@verx/sim": "workspace:*",
        "@verx/ui": "workspace:*",
      },
    },
    "packages/gl": {
      "name": "@verx/gl",
      "version": "0.3.0",
    },
    "packages/kit": {
      "name": "@verx/kit",
      "version": "0.2.0",
      "bin": {
        "verx": "./bin/verx.js",
      },
      "dependencies": {
        "@verx/server": "workspace:*",
        "@verx/ui": "workspace:*",
      },
    },
    "packages/server": {
      "name": "@verx/server",
      "version": "0.2.0",
    },
    "packages/signals": {
      "name": "@verx/signals",
      "version": "0.2.0",
    },
    "packages/sim": {
      "name": "@verx/sim",
      "version": "0.3.0",
    },
    "packages/ui": {
      "name": "@verx/ui",
      "version": "0.2.0",
      "dependencies": {
        "@verx/signals": "workspace:*",
      },
    },
  },
  "packages": {
    "@verx/gl": ["@verx/gl@workspace:packages/gl"],

    "@verx/kit": ["@verx/kit@workspace:packages/kit"],

    "@verx/server": ["@verx/server@workspace:packages/server"],

    "@verx/signals": ["@verx/signals@workspace:packages/signals"],

    "@verx/sim": ["@verx/sim@workspace:packages/sim"],

    "@verx/ui": ["@verx/ui@workspace:packages/ui"],

    "web": ["web@workspace:apps/web"],
  }
}
