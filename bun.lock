{
  "lockfileVersion": 1,
  "configVersion": 1,
  "workspaces": {
    "": {
      "name": "verx-monorepo",
    },
    "apps/web": {
      "name": "web",
      "dependencies": {
        "@verx/gl": "workspace:*",
        "@verx/img": "workspace:*",
        "@verx/kit": "workspace:*",
        "@verx/md": "workspace:*",
        "@verx/search": "workspace:*",
        "@verx/sim": "workspace:*",
        "@verx/ui": "workspace:*",
      },
    },
    "packages/compat": {
      "name": "@verx/compat",
      "version": "0.1.0",
    },
    "packages/gl": {
      "name": "@verx/gl",
      "version": "0.3.0",
    },
    "packages/img": {
      "name": "@verx/img",
      "version": "0.3.0",
    },
    "packages/kit": {
      "name": "@verx/kit",
      "version": "0.2.0",
      "bin": {
        "verx": "./bin/verx.js",
      },
      "dependencies": {
        "@verx/compat": "workspace:*",
        "@verx/img": "workspace:*",
        "@verx/server": "workspace:*",
        "@verx/ui": "workspace:*",
      },
    },
    "packages/md": {
      "name": "@verx/md",
      "version": "0.3.0",
    },
    "packages/search": {
      "name": "@verx/search",
      "version": "0.3.0",
    },
    "packages/server": {
      "name": "@verx/server",
      "version": "0.2.0",
    },
    "packages/signals": {
      "name": "@verx/signals",
      "version": "0.2.0",
    },
    "packages/sim": {
      "name": "@verx/sim",
      "version": "0.3.0",
    },
    "packages/ui": {
      "name": "@verx/ui",
      "version": "0.2.0",
      "dependencies": {
        "@verx/signals": "workspace:*",
      },
    },
    "packages/vscode": {
      "name": "@verx/vscode",
      "version": "0.1.0",
    },
  },
  "packages": {
    "@verx/compat": ["@verx/compat@workspace:packages/compat"],

    "@verx/gl": ["@verx/gl@workspace:packages/gl"],

    "@verx/img": ["@verx/img@workspace:packages/img"],

    "@verx/kit": ["@verx/kit@workspace:packages/kit"],

    "@verx/md": ["@verx/md@workspace:packages/md"],

    "@verx/search": ["@verx/search@workspace:packages/search"],

    "@verx/server": ["@verx/server@workspace:packages/server"],

    "@verx/signals": ["@verx/signals@workspace:packages/signals"],

    "@verx/sim": ["@verx/sim@workspace:packages/sim"],

    "@verx/ui": ["@verx/ui@workspace:packages/ui"],

    "@verx/vscode": ["@verx/vscode@workspace:packages/vscode"],

    "web": ["web@workspace:apps/web"],
  }
}
