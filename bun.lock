{
  "lockfileVersion": 1,
  "configVersion": 1,
  "workspaces": {
    "": {
      "name": "veloz-monorepo",
    },
    "apps/web": {
      "name": "web",
      "dependencies": {
        "@veloz/kit": "workspace:*",
        "@veloz/ui": "workspace:*",
      },
    },
    "packages/kit": {
      "name": "@veloz/kit",
      "version": "0.2.0",
      "bin": {
        "veloz": "./bin/veloz.js",
      },
      "dependencies": {
        "@veloz/server": "workspace:*",
        "@veloz/ui": "workspace:*",
      },
    },
    "packages/server": {
      "name": "@veloz/server",
      "version": "0.2.0",
    },
    "packages/signals": {
      "name": "@veloz/signals",
      "version": "0.2.0",
    },
    "packages/ui": {
      "name": "@veloz/ui",
      "version": "0.2.0",
      "dependencies": {
        "@veloz/signals": "workspace:*",
      },
    },
  },
  "packages": {
    "@veloz/kit": ["@veloz/kit@workspace:packages/kit"],

    "@veloz/server": ["@veloz/server@workspace:packages/server"],

    "@veloz/signals": ["@veloz/signals@workspace:packages/signals"],

    "@veloz/ui": ["@veloz/ui@workspace:packages/ui"],

    "web": ["web@workspace:apps/web"],
  }
}
